name: Build EAZYTAXATION Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app-development
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "src/**"
      - "public/assets/icon.png"
      - ".github/workflows/android-test-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build React application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Android launcher icons
        run: |
          mkdir -p assets
          cp public/assets/icon.png assets/icon.png
          npx --yes @capacitor/assets generate --android

      - name: Configure Android OAuth Deep Link
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = manifest_path.read_text()

          intent_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data
                          android:scheme="com.eazytaxation.mobile"
                          android:host="auth"
                          android:pathPrefix="/callback" />
                  </intent-filter>
          """

          if "com.eazytaxation.mobile" in content:
              print("OAuth deep link already configured.")
          else:
              activity_pattern = re.compile(
                  r'<activity\b(?=[^>]*android:name="[^"]*MainActivity")[^>]*>'
              )

              match = activity_pattern.search(content)

              if not match:
                  raise RuntimeError(
                      "MainActivity was not found in AndroidManifest.xml"
                  )

              closing_tag = content.find(
                  "</activity>",
                  match.end()
              )

              if closing_tag == -1:
                  raise RuntimeError(
                      "MainActivity closing tag was not found"
                  )

              content = (
                  content[:closing_tag]
                  + intent_filter
                  + "\n        "
                  + content[closing_tag:]
              )

              manifest_path.write_text(content)

              print("OAuth deep link configured successfully.")

          PY

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EAZYTAXATION-Android-Test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
