name: Voice Command Module Check

on:
  push:
    branches:
      - ai4bharat-fastapi-development
    paths:
      - "src/pages/ai/AIVoiceCommand.jsx"
      - "src/services/voiceCommandService.js"
      - "supabase/functions/transcribe-voice-audio/**"
      - ".github/workflows/voice-command-check.yml"
  pull_request:
    paths:
      - "src/pages/ai/AIVoiceCommand.jsx"
      - "src/services/voiceCommandService.js"
      - "supabase/functions/transcribe-voice-audio/**"
      - ".github/workflows/voice-command-check.yml"
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build Vite app
        run: npm run build

  edge-function-check:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint transcription Edge Function
        run: test -f supabase/functions/transcribe-voice-audio/index.ts && deno lint --rules-exclude=no-import-prefix,no-unversioned-import ./supabase/functions/transcribe-voice-audio/index.ts
