name: Build SYD Android Sales Development APK

on:
  push:
    branches:
      - android-sales-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android sales development branch
        uses: actions/checkout@v4
        with:
          ref: android-sales-development

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build React application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Install approved SYD icon font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-montserrat
          fc-cache -f

      - name: Generate approved SYD Android launcher icons
        run: npx @capacitor/assets generate --android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew

          # Use Google's read-through mirror of Maven Central first. The default
          # Maven Central endpoint was repeatedly returning HTTP 429 for this runner.
          cat > "$RUNNER_TEMP/syd-maven-mirror.init.gradle" <<'GRADLE'
          def sydMirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          gradle.beforeProject { project ->
            project.buildscript.repositories {
              maven { name = 'SydMavenCentralMirror'; url = sydMirror }
            }
            project.repositories {
              maven { name = 'SydMavenCentralMirror'; url = sydMirror }
            }
          }
          gradle.settingsEvaluated { settings ->
            settings.pluginManagement.repositories {
              maven { name = 'SydPluginMavenMirror'; url = sydMirror }
            }
            settings.dependencyResolutionManagement.repositories {
              maven { name = 'SydDependencyMavenMirror'; url = sydMirror }
            }
          }
          GRADLE

          for attempt in 1 2 3 4; do
            echo "Android Gradle build attempt ${attempt}/4"
            if ./gradlew assembleDebug --no-daemon --init-script "$RUNNER_TEMP/syd-maven-mirror.init.gradle"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 30))
              echo "Gradle build failed; waiting ${delay}s before retry."
              sleep "$delay"
            fi
          done
          echo "Android Gradle build failed after 4 attempts."
          exit 1

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SYD-Android-Sales-Development-Test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
