name: Build SYD Android Sales Development APK

on:
  push:
    branches:
      - android-sales-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android sales development branch
        uses: actions/checkout@v4
        with:
          ref: android-sales-development

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build React application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SYD-Android-Sales-Development-Test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
