name: Android Sales Development APK

on:
  push:
    branches:
      - android-sales-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install Montserrat font for icon rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-montserrat
          fc-cache -f

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Add Android microphone permissions
        run: python3 scripts/ensure-android-microphone-permissions.py

      - name: Install strict offline speech recognition plugin
        run: python3 scripts/ensure-offline-speech-recognition.py

      - name: Generate SYD Android launcher icons
        run: npx @capacitor/assets generate --android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: SYD-Billing-Accounting-Android-Test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
