name: Build SYD Billing & Accounting Android APK

on:
  push:
    branches:
      - android-sales-development
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syd-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android development branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Montserrat font for icon rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-montserrat
          fc-cache -f

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4; do
            echo "npm dependency install attempt ${attempt}/4"
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              npm cache clean --force
              delay=$((attempt * 20))
              echo "npm install failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "npm dependency installation failed after 4 attempts."
          exit 1

      - name: Build complete React application for Android
        run: |
          npm run build
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('capacitor.config.json').read_text())
          assert 'server' not in config or 'url' not in config.get('server', {}), 'APK must not depend on a remote website.'
          assert config.get('webDir') == 'dist', 'APK must bundle the complete React production build.'
          assert Path('dist/index.html').is_file(), 'React production index.html is missing.'
          assets = list(Path('dist/assets').glob('*')) if Path('dist/assets').exists() else []
          assert assets, 'Compiled React assets are missing from dist/assets.'
          print(f'Local APK bundle verified: {len(assets)} compiled assets. No remote server URL configured.')
          PY

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Add Android microphone permissions
        run: python3 scripts/ensure-android-microphone-permissions.py

      - name: Generate SYD Android launcher icons
        run: npx @capacitor/assets generate --android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Register native speech plugin after Capacitor sync
        run: python3 scripts/ensure-offline-speech-recognition.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify native speech bridge inside APK
        run: python3 scripts/verify-android-speech-apk.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: syd-billing-accounting-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest preview APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview-latest
          name: SYD Billing & Accounting – Android Preview
          target_commitish: android-sales-development
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
