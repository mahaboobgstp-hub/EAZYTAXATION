name: Build SYD Billing & Accounting Android APK

on:
  push:
    branches:
      - android-sales-development
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syd-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android development branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Montserrat font for icon rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-montserrat
          fc-cache -f

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4; do
            echo "npm dependency install attempt ${attempt}/4"
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              npm cache clean --force
              delay=$((attempt * 20))
              echo "npm install failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "npm dependency installation failed after 4 attempts."
          exit 1

      - name: Build complete React application for Android
        run: |
          npm run build
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('capacitor.config.json').read_text())
          remote_url = config.get('server', {}).get('url', '').rstrip('/')
          expected_url = 'https://syd-android-development.vercel.app'
          assert remote_url == expected_url, f'Android shell must load the approved remote app: {expected_url}'
          allowed = config.get('server', {}).get('allowNavigation', [])
          assert 'syd-android-development.vercel.app' in allowed, 'Remote app host must be in Capacitor allowNavigation.'
          assert config.get('webDir') == 'dist', 'Capacitor fallback webDir must remain dist.'
          assert Path('dist/index.html').is_file(), 'React production index.html is missing.'
          print(f'Remote-shell APK verified: {remote_url}. Native Android capabilities are bundled in this APK.')
          PY

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate SYD Android launcher icons
        run: npx @capacitor/assets generate --android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Register native speech plugin after Capacitor sync
        run: python3 scripts/ensure-offline-speech-recognition.py

      - name: Add Android microphone and notification permissions after Capacitor sync
        run: |
          python3 scripts/ensure-android-microphone-permissions.py
          python3 scripts/ensure-android-notification-permissions.py

      - name: Verify notification, microphone and PDF native plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml').read_text()
          gradle = Path('android/app/capacitor.build.gradle').read_text()
          assert 'android.permission.POST_NOTIFICATIONS' in manifest, 'POST_NOTIFICATIONS is missing from AndroidManifest.xml'
          assert 'android.permission.RECORD_AUDIO' in manifest, 'RECORD_AUDIO is missing from AndroidManifest.xml'
          assert 'android.permission.MODIFY_AUDIO_SETTINGS' in manifest, 'MODIFY_AUDIO_SETTINGS is missing from AndroidManifest.xml'
          assert 'android.permission.VIBRATE' in manifest, 'VIBRATE is missing from AndroidManifest.xml'
          assert 'android.permission.CAMERA' in manifest, 'CAMERA is missing from AndroidManifest.xml'
          assert 'CameraPermissionPlugin.class' in Path('android/app/src/main/java/com/eazytaxation/mobile/MainActivity.java').read_text(), 'Camera permission plugin is not registered in MainActivity.'
          assert 'capacitor-local-notifications' in gradle, 'Capacitor Local Notifications plugin is not registered.'
          assert 'capacitor-community-file-opener' in gradle, 'Capacitor File Opener plugin is not registered.'
          print('Verified Android notification permission and both native PDF notification/opening plugins.')
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify native speech bridge and notification permissions inside APK
        run: |
          python3 scripts/verify-android-speech-apk.py
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path
          apk = Path('android/app/build/outputs/apk/debug/app-debug.apk')
          aapt = shutil.which('aapt')
          if not aapt:
              sdk = Path(os.environ.get('ANDROID_HOME', '/opt/android-sdk'))
              candidates = list((sdk / 'build-tools').glob('*/aapt'))
              if candidates:
                  aapt = str(sorted(candidates)[-1])
          if not aapt:
              raise SystemExit('ERROR: aapt not found; cannot inspect packaged APK permissions.')
          result = subprocess.run([aapt, 'dump', 'permissions', str(apk)], capture_output=True, text=True)
          if result.returncode:
              raise SystemExit(result.stderr or 'ERROR: Unable to inspect APK permissions.')
          required = ('android.permission.POST_NOTIFICATIONS', 'android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS', 'android.permission.CAMERA')
          missing = [permission for permission in required if permission not in result.stdout]
          if missing:
              raise SystemExit('ERROR: Permissions missing from final APK: ' + ', '.join(missing))
          print('Final APK includes notification and microphone permissions.')
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: syd-billing-accounting-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest preview APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview-latest
          name: SYD Billing & Accounting – Android Preview
          target_commitish: android-sales-development
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
