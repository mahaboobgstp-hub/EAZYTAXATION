name: AI4Bharat FastAPI Service Check

on:
  push:
    branches:
      - ai4bharat-fastapi-development
    paths:
      - "services/ai4bharat-asr/**"
      - "src/pages/ai/AIVoiceCommand.jsx"
      - "src/services/voiceCommandService.js"
      - "supabase/functions/transcribe-voice-audio/**"
      - ".github/workflows/ai4bharat-asr-check.yml"
  pull_request:
    paths:
      - "services/ai4bharat-asr/**"
      - "src/pages/ai/AIVoiceCommand.jsx"
      - "src/services/voiceCommandService.js"
      - "supabase/functions/transcribe-voice-audio/**"
      - ".github/workflows/ai4bharat-asr-check.yml"
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai4bharat-asr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile app/main.py
      - name: Validate required service files
        run: |
          test -s requirements.txt
          test -s Dockerfile
          test -s .env.example
          test -s README.md

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build Vite app
        run: npm run build

  edge-function-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint transcription Edge Function source
        run: deno lint --rules-exclude=no-import-prefix,no-unversioned-import supabase/functions/transcribe-voice-audio/index.ts
