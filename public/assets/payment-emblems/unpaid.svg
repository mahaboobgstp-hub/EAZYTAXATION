<svg xmlns="http://www.w3.org/2000/svg" width="280" height="72" viewBox="0 0 280 72" role="img" aria-label="Unpaid">
  <defs>
    <linearGradient id="lemon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffd0"/>
      <stop offset=".22" stop-color="#fff69a"/>
      <stop offset=".58" stop-color="#f5e85b"/>
      <stop offset="1" stop-color="#ddc92c"/>
    </linearGradient>
    <linearGradient id="lemonEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbc1"/>
      <stop offset="1" stop-color="#c6b21d"/>
    </linearGradient>
    <filter id="soft3d" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="shadow"/>
      <feColorMatrix in="shadow" type="matrix" values="0 0 0 0 .38 0 0 0 0 .33 0 0 0 0 .02 0 0 0 .3 0" result="shadowColor"/>
      <feMerge><feMergeNode in="shadowColor"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="rotate(-2 140 36)" filter="url(#soft3d)" stroke-linejoin="round" paint-order="stroke fill">
    <text x="140" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="900" letter-spacing="-2.2" fill="#c9b51d" stroke="#c9b51d" stroke-width="7">UNPAID</text>
    <text x="140" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="900" letter-spacing="-2.2" fill="url(#lemon)" stroke="url(#lemonEdge)" stroke-width="1.8">UNPAID</text>
    <text x="140" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="900" letter-spacing="-2.2" fill="#ffffff" opacity=".2">UNPAID</text>
  </g>
</svg>